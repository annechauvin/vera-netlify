<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERA — Find a Market</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0E0E0C;--paper:#F6F3EE;--paper2:#EFECEA;
  --gold:#B8872A;--gold-bg:rgba(184,135,42,0.08);--gold-bd:rgba(184,135,42,0.25);
  --green:#2D6A4F;--green-bg:rgba(45,106,79,0.08);--green-bd:rgba(45,106,79,0.25);
  --red:#9B2226;--red-bg:rgba(155,34,38,0.08);--red-bd:rgba(155,34,38,0.2);
  --border:rgba(14,14,12,0.08);
}
body{font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.hdr{padding:14px 20px;border-bottom:1px solid var(--border);background:white;flex-shrink:0}
.hdr-title{font-size:14px;font-weight:600}
.hdr-sub{font-size:11px;color:rgba(14,14,12,0.4);margin-top:1px}
.msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.msg.vera .av{background:var(--gold-bg);border:1px solid var(--gold-bd)}
.msg.user .av{background:var(--paper2);border:1px solid var(--border)}
.bub{flex:1;font-size:13px;line-height:1.7;color:var(--ink)}
.bub.vera-bub{background:white;border:1px solid var(--border);border-radius:2px 12px 12px 12px;padding:12px 15px}
.bub.user-bub{background:var(--gold);color:white;border-radius:12px 2px 12px 12px;padding:10px 14px;max-width:80%;font-size:13px}

/* Province picker chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:var(--paper2);font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;color:var(--ink);transition:all .13s}
.chip:hover{border-color:var(--gold-bd);background:var(--gold-bg);color:var(--gold)}
.chip.selected{border-color:var(--gold);background:var(--gold);color:white}
.chip.disabled{opacity:.4;cursor:not-allowed}
.confirm-btn{margin-top:12px;padding:10px 20px;background:var(--gold);border:none;border-radius:8px;color:white;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;display:none}
.confirm-btn:hover{opacity:.88}

/* Comparison table */
.comp-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;background:white;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.comp-table th{background:var(--ink);color:white;padding:10px 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em}
.comp-table th:first-child{width:140px}
.comp-table td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--ink)}
.comp-table tr:last-child td{border-bottom:none}
.comp-table tr:nth-child(even) td{background:var(--paper)}
.comp-table td:first-child{font-weight:500;color:rgba(14,14,12,0.55);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.tag.g{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.tag.a{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-bd)}
.tag.r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}

/* Verdict row */
.verdict-row td{font-size:16px;font-weight:700;font-family:'Playfair Display',serif}

/* Typing */
.typing{display:flex;gap:5px;padding:4px 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:tdot .8s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-5px);opacity:1}}

/* Input */
.ibar{padding:12px 20px;border-top:1px solid var(--border);background:white;flex-shrink:0}
.iwrap{display:flex;gap:8px;align-items:flex-end;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:8px 8px 8px 14px}
.iwrap:focus-within{border-color:var(--gold)}
.ifield{flex:1;background:transparent;border:none;outline:none;font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);resize:none;max-height:100px;min-height:20px;line-height:1.55}
.ifield::placeholder{color:rgba(14,14,12,0.3)}
.sbtn{width:32px;height:32px;border-radius:8px;background:var(--gold);border:none;cursor:pointer;font-size:14px;color:white;flex-shrink:0}
.sbtn:disabled{opacity:.35;cursor:not-allowed}
.src-note{font-size:10px;color:rgba(14,14,12,0.3);margin-top:10px;line-height:1.6}

@media print {
  .hdr, .ibar, .chips, .confirm-btn, .next-box, .print-btn { display:none!important }
  body { background:white!important; overflow:visible!important; height:auto!important }
  .msgs { overflow:visible!important; padding:0!important }
  .msg.user { display:none!important }
  .bub.vera-bub { border:none!important; padding:0!important; box-shadow:none!important }
  .comp-table { page-break-inside:avoid; font-size:10px }
  .comp-table th { background:#333!important; -webkit-print-color-adjust:exact; print-color-adjust:exact }
  .tag { -webkit-print-color-adjust:exact; print-color-adjust:exact }
  .src-note { font-size:8px }
  @page { margin:15mm; size:landscape }
}
</style>
</head>
<body>

<div class="hdr" style="display:flex;align-items:center;justify-content:space-between">
  <div>
    <div class="hdr-title">🗺 Find a Market</div>
    <div class="hdr-sub">Guided market research</div>
  </div>
  <button class="print-btn" onclick="window.print()" style="padding:7px 14px;background:var(--gold);border:none;border-radius:7px;color:white;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif">🖨 Save PDF</button>
</div>

<div class="msgs" id="msgs"></div>

<div class="ibar">
  <div class="iwrap">
    <textarea class="ifield" id="inp" placeholder="Type your answer..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendText()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
    <button class="sbtn" id="sbtn" onclick="sendText()">↑</button>
  </div>
</div>

<script>
const PROXY = 'https://vera-proxy.onrender.com';
const PROVINCES = [
  'New Brunswick','Nova Scotia','Prince Edward Island','Newfoundland',
  'Ontario','Quebec','Alberta','British Columbia','Manitoba','Saskatchewan'
];
var step = 'pick-provinces';
var selectedProvinces = [];
var knowledge = '';
var busy = false;

// ── Add message ──
function addMsg(role, html, isText) {
  var container = document.getElementById('msgs');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  var av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'vera' ? '💡' : '👤';
  var bub = document.createElement('div');
  bub.className = 'bub ' + (role === 'vera' ? 'vera-bub' : 'user-bub');
  if (isText) bub.textContent = html;
  else bub.innerHTML = html;
  div.appendChild(av);
  div.appendChild(bub);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return bub;
}

// ── Province picker ──
function showProvincePicker() {
  pickerCount++;
  var pid = 'picker-' + pickerCount;
  var cid = 'confirm-' + pickerCount;
  var html = 'Which provinces would you like to compare? Pick up to 3.'
    + '<div class="chips" id="' + pid + '">';
  PROVINCES.forEach(function(p) {
    html += '<button class="chip" onclick="toggleProvince(this,\'' + p + '\',\'' + pid + '\',\'' + cid + '\')">' + p + '</button>';
  });
  html += '</div><button class="confirm-btn" id="' + cid + '" onclick="confirmProvinces(\'' + pid + '\',\'' + cid + '\')">Compare these provinces →</button>';
  addMsg('vera', html);
}

function toggleProvince(btn, province, pid, cid) {
  if (btn.classList.contains('selected')) {
    btn.classList.remove('selected');
    selectedProvinces = selectedProvinces.filter(function(p) { return p !== province; });
  } else {
    if (selectedProvinces.length >= 3) return;
    btn.classList.add('selected');
    selectedProvinces.push(province);
  }
  var confirmBtn = document.getElementById(cid);
  if (selectedProvinces.length >= 2) {
    confirmBtn.style.display = 'block';
    confirmBtn.textContent = 'Compare ' + selectedProvinces.join(', ') + ' →';
  } else {
    confirmBtn.style.display = 'none';
  }
  // Disable unselected chips in this picker only
  var picker = document.getElementById(pid);
  if (picker) picker.querySelectorAll('.chip').forEach(function(c) {
    if (!c.classList.contains('selected')) {
      c.classList.toggle('disabled', selectedProvinces.length >= 3);
    }
  });
}

function confirmProvinces(pid, cid) {
  if (selectedProvinces.length < 2) return;
  // Disable this picker
  var picker = document.getElementById(pid);
  if (picker) picker.querySelectorAll('.chip').forEach(function(c) { c.disabled = true; c.style.pointerEvents='none'; });
  var confirmBtn = document.getElementById(cid);
  if (confirmBtn) confirmBtn.style.display = 'none';
  addMsg('user', selectedProvinces.join(', '), true);
  step = 'researching';
  researchProvinces();
}

// ── Research provinces ──
async function researchProvinces() {
  var typingBub = addMsg('vera', '<div class="typing"><span></span><span></span><span></span></div>');
  addMsg('vera', 'Searching CMHC, StatsCan, and local MLS data for ' + selectedProvinces.join(', ') + '...', true);

  var sysPrompt = 'You are a Canadian multifamily real estate market research assistant.'
    + '\n\nCompare these provinces for multifamily real estate investment using EXACTLY these 7 criteria: '
    + selectedProvinces.join(', ') + '\n\n'
    + 'THE 7 CRITERIA (use these exact names, in this exact order):\n'
    + '1. Population size & growth — population size + 5-year growth rate\n'
    + '2. Household income — median household income\n'
    + '3. Average price per unit — avg price per unit for multifamily (duplex/triplex)\n'
    + '4. Average market rents — avg 2BR rent per month\n'
    + '5. Vacancy rate — current rental vacancy rate\n'
    + '6. Employers & economic stability — major employers and economic diversity\n'
    + '7. Landlord-friendly laws — rent control, eviction process, tenant protections\n\n'
    + 'Return ONLY valid JSON, no markdown:\n'
    + '{\n'
    + '  "provinces": [\n'
    + '    {\n'
    + '      "name": "Province name",\n'
    + '      "grade": "A/B/C/D",\n'
    + '      "class": "go/caution/skip",\n'
    + '      "population": {"val": "e.g. 800,000 · +8.2% (5yr)", "src": "Statistics Canada Census 2021 + Population Estimates 2024"},\n'
    + '      "household_income": {"val": "e.g. $68,000 median", "src": "Statistics Canada Census 2021"},\n'
    + '      "avg_price": {"val": "e.g. $175K–$200K/unit", "src": "CREA MLS Market Stats 2024"},\n'
    + '      "avg_rent": {"val": "e.g. $1,150–$1,300/mo", "src": "CMHC Rental Market Report 2024"},\n'
    + '      "vacancy": {"val": "e.g. 1.5%", "src": "CMHC Rental Market Report 2024"},\n'
    + '      "employers": {"val": "e.g. Government, healthcare, education, Irving Industries", "src": "Statistics Canada Labour Force Survey 2024"},\n'
    + '      "landlord_laws": {"val": "e.g. No rent control; 3.8% annual cap (2024); efficient eviction process", "src": "New Brunswick Residential Tenancies Act 2023"},\n'
    + '      "verdict": "one specific sentence — investment recommendation for this province"\n'
    + '    }\n'
    + '  ],\n'
    + '  "winner": "Province name",\n'
    + '  "winner_reason": "one sentence on why this province wins",\n'
    + '  "sources": "all sources listed"\n'
    + '}\n\n'
    + 'STRICT RULES:\n'
    + '- Use EXACTLY the 7 criteria above — no cap rate, no price-to-rent ratio, nothing extra\n'
    + '- Every single field must have a real src citation, but keep each src to ONE short source name only — never combine multiple sources or add parenthetical citations, to keep the response concise\n'
    + '- For landlord laws: cite the exact act name and year (e.g. "Ontario Residential Tenancies Act 2006")\n'
    + '- For employers: cite Statistics Canada or local economic development source\n'
    + '- grade: A=strong buy, B=good, C=marginal, D=avoid\n'
    + '- class: go=A, caution=B/C, skip=D\n'
    + '- If data unavailable, write "data unavailable"\n'
    + '- "sources" at the end should list only the 5-6 most important sources overall, one line each — not an exhaustive list\n'
    + '- Only include the requested provinces — nothing else';

  try {
    var resp = await fetch(PROXY + '/insights', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: sysPrompt, category: 'Find a Market', mode: 'market' })
    });
    var raw = await resp.json();
    if (raw.error) throw new Error(raw.error);
    var data = raw;
    if (raw.answer) { raw.answer = raw.answer.replace(/```json/g,"").replace(/```/g,""); var _s1=raw.answer.indexOf("{"),_e1=raw.answer.lastIndexOf("}"); if(_s1!==-1&&_e1>_s1){try{data=JSON.parse(raw.answer.substring(_s1,_e1+1));}catch(e){}} }
    // Remove typing indicator
    if (typingBub && typingBub.parentElement) typingBub.parentElement.remove();

    // Render comparison table
    renderComparisonTable(data);

    // Ask what's next
    setTimeout(function() {
      askNextStep();
    }, 500);

  } catch(err) {
    console.error('Research error:', err);
    typingBub.innerHTML = 'Error: ' + err.message + ' — please try again.';
  }
}

function renderComparisonTable(data) {
  var provinces = data.provinces || [];
  if (!provinces.length) return;

  var rows = [
    { key: 'grade', label: 'Grade' },
    { key: 'population', label: '1. Population & growth' },
    { key: 'household_income', label: '2. Household income' },
    { key: 'avg_price', label: '3. Avg price per unit' },
    { key: 'avg_rent', label: '4. Avg market rents' },
    { key: 'vacancy', label: '5. Vacancy rate' },
    { key: 'employers', label: '6. Employers & economy' },
    { key: 'landlord_laws', label: '7. Landlord-friendly laws' },
    { key: 'verdict', label: 'Verdict' },
  ];

  var gradeColor = { A:'g', B:'a', C:'a', D:'r' };

  var html = '<table class="comp-table"><thead><tr><th>Criteria</th>';
  provinces.forEach(function(p) { html += '<th>' + p.name + '</th>'; });
  html += '</tr></thead><tbody>';

  rows.forEach(function(row) {
    html += '<tr><td>' + row.label + '</td>';
    provinces.forEach(function(p) {
      if (row.key === 'grade') {
        var grade = p.grade || '—';
        html += '<td><span class="tag ' + (gradeColor[grade]||'a') + '">' + grade + '</span></td>';
      } else if (row.key === 'verdict') {
        html += '<td style="font-size:11px;color:rgba(14,14,12,0.65);font-style:italic">' + (p.verdict||'—') + '</td>';
      } else {
        var field = p[row.key] || {};
        var val = typeof field === 'object' ? (field.val||'—') : (field||'—');
        var src = typeof field === 'object' ? (field.src||'') : '';
        html += '<td>' + val + (src ? '<div style="font-size:9px;color:rgba(14,14,12,0.3);margin-top:3px">' + src + '</div>' : '') + '</td>';
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';

  if (data.winner) {
    html += '<div style="margin-top:12px;padding:12px 15px;background:var(--green-bg);border:1px solid var(--green-bd);border-radius:10px">';
    html += '<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:4px">Best province for multifamily</div>';
    html += '<div style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px">' + data.winner + '</div>';
    html += '<div style="font-size:12px;color:rgba(14,14,12,0.6)">' + (data.winner_reason||'') + '</div>';
    html += '</div>';
  }

  if (data.sources) {
    html += '<div class="src-note">Sources: ' + data.sources + '</div>';
  }

  addMsg('vera', html);
}

function askNextStep() {
  var winner = selectedProvinces[0];
  var html = 'Great — now that you have your province comparison, what would you like to do next?'
    + '<div class="chips" style="margin-top:10px">';
  selectedProvinces.forEach(function(p) {
    html += '<button class="chip" onclick="researchCities(\'' + p + '\')">'
      + 'Research cities in ' + p + ' →</button>';
  });
  html += '<button class="chip" onclick="startOver()">Compare different provinces</button>';
  html += '</div>';
  addMsg('vera', html);
  step = 'next-step';
}

function researchCities(province) {
  addMsg('user', 'Research cities in ' + province, true);
  step = 'city-research';
  researchCitiesInProvince(province);
}

// Salvage partial JSON if a response got cut off mid-object (e.g. token-limit truncation).
// Trims back to the last fully-closed object in an array and re-closes any open brackets/braces.
function repairTruncatedJSON(str) {
  // If truncated mid-string (odd number of quotes), close the open string first —
  // otherwise none of the boundary patterns below will find a valid stopping point.
  var quoteCount = (str.match(/"/g) || []).length;
  var working = quoteCount % 2 !== 0 ? str + '"' : str;

  // Try each safe truncation boundary and keep whichever preserves the most content —
  // end of an object in an array ('},'), end of a nested array ('],'), or end of any
  // complete "key": "value" string pair ('",'). This matters because a truncated
  // trailing field (e.g. a long "sources" string cut off after the real data —
  // cities, recommendation, reason — is already complete) needs the '",' boundary to
  // recover everything; only trying '},' would throw away good data unnecessarily.
  var boundaries = ['},', '],', '",'];
  var lastGoodEntry = -1;
  boundaries.forEach(function(b) {
    var idx = working.lastIndexOf(b);
    if (idx > lastGoodEntry) lastGoodEntry = idx;
  });
  if (lastGoodEntry === -1) return null;

  var trimmed = working.substring(0, lastGoodEntry + 1);
  var openBraces = (trimmed.match(/{/g) || []).length - (trimmed.match(/}/g) || []).length;
  var openBrackets = (trimmed.match(/\[/g) || []).length - (trimmed.match(/\]/g) || []).length;
  var closer = '';
  for (var i = 0; i < openBrackets; i++) closer += ']';
  for (var i = 0; i < openBraces; i++) closer += '}';
  return trimmed + closer;
}

// Tries every extraction strategy in order: direct parse, brace-extraction, then repair-of-truncated.
// Returns parsed object, or null if every strategy failed. Stashes the raw response on
// window._lastCityDebug so the UI can show it inline (no DevTools needed) if everything fails.
function parseCityResponse(raw2) {
  window._lastCityDebug = raw2;
  if (!raw2 || !raw2.answer) return raw2 || null;
  var ans = raw2.answer.replace(/```json/g,'').replace(/```/g,'').trim();

  try { return JSON.parse(ans); } catch(e1) {}

  var s = ans.indexOf('{'), e = ans.lastIndexOf('}');
  if (s !== -1 && e > s) {
    var candidate = ans.substring(s, e + 1);
    try { return JSON.parse(candidate); } catch(e2) {}

    // If that failed, the response is likely truncated with NO final closing brace —
    // meaning `e` (lastIndexOf('}')) found some small inner field's brace instead of
    // the real end, and `candidate` above already lost everything after it. Repair
    // needs the FULL remaining text (first brace to the actual end of the string),
    // not the over-truncated candidate, so it can find the true best boundary.
    var repaired = repairTruncatedJSON(ans.substring(s));
    if (repaired) {
      try { return JSON.parse(repaired); } catch(e3) {
        console.error('VERA city JSON repair failed:', e3, ans);
      }
    } else {
      console.error('VERA city JSON parse failed:', e2, ans);
    }
  } else {
    console.error('VERA city response had no JSON braces at all:', ans);
  }
  return null;
}

async function fetchCityData(province) {
  var resp = await fetch(PROXY + '/insights', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: buildCityPrompt(province), category: 'Find a Market', mode: 'market' })
  });
  var rawText = await resp.text();
  window._lastCityHttpStatus = resp.status;
  var raw2;
  try {
    raw2 = JSON.parse(rawText);
  } catch(e) {
    // The backend didn't even return valid JSON at the HTTP level (e.g. an error page or timeout).
    window._lastCityDebug = rawText;
    console.error('VERA city fetch: response was not JSON. HTTP ' + resp.status + ':', rawText);
    return null;
  }
  if (raw2.error) throw new Error(raw2.error);
  return parseCityResponse(raw2);
}

function buildCityPrompt(province) {
  return 'You are a Canadian multifamily real estate market research assistant.'
    + '\n\nCompare ALL major cities in ' + province + ' for multifamily real estate investment using EXACTLY these 8 criteria:\n'
    + '1. Population — city population size\n'
    + '2. Population growth — 5-year growth rate\n'
    + '3. Household income — median household income\n'
    + '4. Avg price per unit — avg multifamily price per unit\n'
    + '5. Vacancy rate — current rental vacancy rate\n'
    + '6. Avg 1BR rent — average 1 bedroom rent per month\n'
    + '7. Avg 2BR rent — average 2 bedroom rent per month\n'
    + '8. Avg 3BR rent — average 3 bedroom rent per month\n\n'
    + 'Return ONLY valid JSON no markdown:\n'
    + '{\n'
    + '  "cities": [\n'
    + '    {\n'
    + '      "name": "City name",\n'
    + '      "grade": "A/B/C/D",\n'
    + '      "population": {"val": "e.g. 67,575", "src": "Statistics Canada Census 2021"},\n'
    + '      "population_growth": {"val": "e.g. +8.2% (5yr)", "src": "Statistics Canada Census 2021"},\n'
    + '      "household_income": {"val": "e.g. $58,000 median", "src": "Statistics Canada Census 2021"},\n'
    + '      "avg_price": {"val": "e.g. $175K-$200K/unit", "src": "CREA MLS 2024"},\n'
    + '      "vacancy": {"val": "e.g. 1.5%", "src": "CMHC Rental Market Report 2024"},\n'
    + '      "rent_1br": {"val": "e.g. $1,050/mo", "src": "CMHC Rental Market Report 2024"},\n'
    + '      "rent_2br": {"val": "e.g. $1,200/mo", "src": "CMHC Rental Market Report 2024"},\n'
    + '      "rent_3br": {"val": "e.g. $1,400/mo", "src": "CMHC Rental Market Report 2024"},\n'
    + '      "verdict": "one sentence investment recommendation"\n'
    + '    }\n'
    + '  ],\n'
    + '  "recommended_city": "City name",\n'
    + '  "reason": "one sentence why this city wins",\n'
    + '  "sources": "all sources listed"\n'
    + '}\n\n'
    + 'RULES:\n'
    + '- grade: A=strong buy, B=good, C=marginal, D=avoid\n'
    + '- List the top 5 to 6 cities in ' + province + ' ranked by investment potential\n'
    + '- Every val must have a real src citation, but keep each src to ONE short source name only (e.g. "CMHC Rental Market Report 2024") — never combine multiple sources or add parenthetical citations, to keep the response concise\n'
    + '- "sources" at the end should list only the 5-6 most important sources overall, one line each — not an exhaustive list\n'
    + '- If data unavailable write "data unavailable"';
}

async function researchCitiesInProvince(province) {
  var typingBub = addMsg('vera', '<div class="typing"><span></span><span></span><span></span></div>');
  addMsg('vera', 'Searching CMHC, StatsCan, and local MLS data for cities in ' + province + '...', true);

  try {
    var data = await fetchCityData(province);

    // If parsing failed outright (data is null) or came back with no cities,
    // automatically retry once before giving up — this is the fix for the
    // intermittent "could not retrieve" failures.
    if (!data || !(data.cities && data.cities.length)) {
      console.warn('VERA city research: first attempt failed or empty, retrying once for ' + province);
      data = await fetchCityData(province);
    }

    // Remove typing and searching messages
    if (typingBub && typingBub.parentElement) typingBub.parentElement.remove();
    var msgs = document.getElementById('msgs');
    if (msgs.lastElementChild) msgs.lastElementChild.remove();

    var cities = (data && data.cities) || [];

    if (!cities.length) {
      var debugInfo = window._lastCityDebug;
      var debugText = '';
      if (typeof debugInfo === 'string') {
        debugText = debugInfo;
      } else if (debugInfo && typeof debugInfo === 'object') {
        try { debugText = JSON.stringify(debugInfo, null, 2); } catch(e) { debugText = String(debugInfo); }
      }

      var errHtml = 'I could not retrieve city data for ' + province + '. Please try again.';
      if (debugText) {
        errHtml += '<div style="margin-top:10px;padding:10px 12px;background:var(--paper2);border:1px solid var(--border);border-radius:8px;font-family:\'DM Mono\',monospace;font-size:10px;color:rgba(14,14,12,0.65);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto">'
          + 'Debug — HTTP ' + (window._lastCityHttpStatus||'?') + ':\n' + debugText.replace(/</g,'&lt;').replace(/>/g,'&gt;')
          + '</div>';
      }
      addMsg('vera', errHtml);
      return;
    }

    var gradeColor = { A:'g', B:'a', C:'a', D:'r' };
    var cityRows = [
      { key: 'population',        label: 'Population' },
      { key: 'population_growth', label: 'Population growth' },
      { key: 'household_income',  label: 'Household income' },
      { key: 'avg_price',         label: 'Avg price per unit' },
      { key: 'vacancy',           label: 'Vacancy rate' },
      { key: 'rent_1br',          label: 'Avg 1BR rent' },
      { key: 'rent_2br',          label: 'Avg 2BR rent' },
      { key: 'rent_3br',          label: 'Avg 3BR rent' },
    ];

    var html = '<table class="comp-table"><thead><tr><th>Criteria</th>';
    cities.forEach(function(city) {
      html += '<th>' + city.name + '<br><span class="tag ' + (gradeColor[city.grade]||'a') + '" style="margin-top:4px;display:inline-block">' + city.grade + '</span></th>';
    });
    html += '</tr></thead><tbody>';

    cityRows.forEach(function(row) {
      html += '<tr><td>' + row.label + '</td>';
      cities.forEach(function(city) {
        var field = city[row.key] || {};
        var val = typeof field === 'object' ? (field.val||'—') : (field||'—');
        var src = typeof field === 'object' ? (field.src||'') : '';
        html += '<td>' + val + (src ? '<div style="font-size:9px;color:rgba(14,14,12,0.3);margin-top:2px">' + src + '</div>' : '') + '</td>';
      });
      html += '</tr>';
    });

    html += '<tr style="background:var(--paper2)"><td style="font-weight:600">Verdict</td>';
    cities.forEach(function(city) {
      html += '<td style="font-size:11px;color:rgba(14,14,12,0.65);font-style:italic">' + (city.verdict||'—') + '</td>';
    });
    html += '</tr></tbody></table>';

    if (data.recommended_city) {
      html += '<div style="margin-top:12px;padding:12px 15px;background:var(--green-bg);border:1px solid var(--green-bd);border-radius:10px">';
      html += '<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:4px">Recommended city</div>';
      html += '<div style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px">' + data.recommended_city + '</div>';
      html += '<div style="font-size:12px;color:rgba(14,14,12,0.6)">' + (data.reason||'') + '</div></div>';
    }

    if (data.sources) html += '<div class="src-note">Sources: ' + data.sources + '</div>';
    addMsg('vera', html);

    // Cache city-level data (price/unit, grade) to localStorage so vera-account.html
    // can pull real price-per-unit benchmarks when analyzing a specific property in
    // one of these cities, instead of having no market data to compare against.
    try {
      var cityCache = JSON.parse(localStorage.getItem('vera_market_cities') || '{}');
      cities.forEach(function(city) {
        if (!city.name) return;
        cityCache[city.name.toLowerCase().trim()] = {
          name: city.name,
          province: province,
          grade: city.grade || null,
          avgPricePerUnit: (city.avg_price && city.avg_price.val) || null,
          avgPricePerUnitSrc: (city.avg_price && city.avg_price.src) || null,
          updatedAt: Date.now()
        };
      });
      localStorage.setItem('vera_market_cities', JSON.stringify(cityCache));
    } catch(e) { console.warn('VERA: could not cache city market data', e); }

    // Ask about neighbourhoods
    if (data.recommended_city) {
      window._lastRecommendedCity = data.recommended_city;
      window._lastProvince = province;
      // Also persist to localStorage (not just this window) so the Find a Realtor
      // tab — a separate sibling iframe — can pick up this market as its default.
      try {
        localStorage.setItem('vera_last_market', JSON.stringify({
          city: data.recommended_city, province: province, updatedAt: Date.now()
        }));
      } catch(e) {}
      setTimeout(function() {
        var nextHtml = 'Would you like me to grade the neighbourhoods in ' + data.recommended_city + '?'
          + '<div class="chips" style="margin-top:10px">'
          + '<button class="chip" onclick="researchNeighbourhoods(window._lastRecommendedCity,window._lastProvince)">Yes — grade neighbourhoods in ' + data.recommended_city + '</button>'
          + '<button class="chip" onclick="startOver()">Start over</button>'
          + '</div>';
        addMsg('vera', nextHtml);
      }, 400);
    }

  } catch(err) {
    if (typingBub && typingBub.parentElement) typingBub.parentElement.remove();
    addMsg('vera', 'Error: ' + err.message + '. Please try again.', true);
  }
}


async function researchNeighbourhoods(city, province) {
  addMsg('user', 'Grade neighbourhoods in ' + city, true);
  var typingBub = addMsg('vera', '<div class="typing"><span></span><span></span><span></span></div>');

  var sysPrompt = 'You are a Canadian multifamily real estate market research assistant.'
    + '\n\nResearch and classify the neighbourhoods in ' + city + ', ' + province + ' for multifamily real estate investing.\n\n'
    + 'Use this EXACT neighbourhood class system:\n'
    + 'Class A: 0-10yr properties, prime locations, premium rents, low risk turnkey. Not ideal for BRRRR.\n'
    + 'Class B: 10-15yr properties, minor updates needed, moderate rents. Good for BRRRR with cosmetic upgrades.\n'
    + 'Class C: 15-30yr properties, significant renovation needed, lower rents. Best for beginner BRRRR investors.\n'
    + 'Class D: 30yr+ properties, extensive repairs, safety concerns, highest risk. Experienced investors only.\n\n'
    + 'Return ONLY valid JSON, no markdown, no explanation:\n'
    + '{"neighbourhoods":[{"class":"A/B/C/D","name":"Neighbourhood name","avg_rent":"$X/mo","avg_rent_src":"CMHC 2024","property_age":"e.g. 1970s-1980s stock","detail":"2-3 sentences on tenant profile, BRRRR suitability, price zone"}],"best_neighbourhood":"Name","reason":"one sentence","sources":"all sources"}\n\n'
    + 'RULES:\n'
    + '- Use class not grade\n'
    + '- List ALL significant neighbourhoods in ' + city + '\n'
    + '- Every avg_rent must have a source\n'
    + '- Return JSON only — no text before or after the JSON object'

  try {
    var resp = await fetch(PROXY + '/insights', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: sysPrompt, category: 'Find a Market', mode: 'market' })
    });
    var raw2 = await resp.json();
    if (raw2.error) throw new Error(raw2.error);
    var data = raw2;
    if (raw2.answer) {
      try {
        var ans2 = raw2.answer.replace(/```json/g,'').replace(/```/g,'').trim();
        data = JSON.parse(ans2);
      } catch(e1) {
        try {
          var s2=raw2.answer.indexOf('{'), e2=raw2.answer.lastIndexOf('}');
          if(s2!==-1&&e2>s2) data=JSON.parse(raw2.answer.substring(s2,e2+1));
        } catch(e2) {}
      }
    }
    typingBub.parentElement.remove();

    var hoods = data.neighbourhoods || [];
    var classColor = { A:'g', B:'g', C:'a', D:'r' };
    var html = '<table class="comp-table"><thead><tr><th>Neighbourhood</th><th>Class</th><th>Avg rent</th><th>Property age</th><th>Investment insight</th></tr></thead><tbody>';
    hoods.forEach(function(h) {
      var cls = h.class || h.grade || '?';
      var rentSrc = h.avg_rent_src ? '<div style="font-size:9px;color:rgba(14,14,12,0.3);margin-top:2px">' + h.avg_rent_src + '</div>' : '';
      html += '<tr>'
        + '<td style="font-weight:600;color:var(--ink)">' + h.name + '</td>'
        + '<td><span class="tag ' + (classColor[cls]||'a') + '">Class ' + cls + '</span></td>'
        + '<td>' + (h.avg_rent||'—') + rentSrc + '</td>'
        + '<td style="font-size:11px;color:rgba(14,14,12,0.5)">' + (h.property_age||'—') + '</td>'
        + '<td style="font-size:11px">' + (h.detail||'') + '</td>'
        + '</tr>';
    });
    html += '</tbody></table>';

    if (data.best_neighbourhood) {
      html += '<div style="margin-top:12px;padding:12px 15px;background:var(--green-bg);border:1px solid var(--green-bd);border-radius:10px">';
      html += '<div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:4px">Best neighbourhood to buy in</div>';
      html += '<div style="font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px">' + data.best_neighbourhood + '</div>';
      html += '<div style="font-size:12px;color:rgba(14,14,12,0.6)">' + (data.reason||'') + '</div></div>';
    }

    if (data.sources) html += '<div class="src-note">Sources: ' + data.sources + '</div>';
    addMsg('vera', html);

    setTimeout(function() {
      var saveHtml = 'Your market is selected: <strong>' + (data.best_neighbourhood ? data.best_neighbourhood + ', ' : '') + city + ', ' + province + '</strong>.'
        + '<div class="chips" style="margin-top:10px">'
        + '<button class="chip" onclick="saveMarket(\'' + city + '\',\'' + province + '\',\'' + (data.best_neighbourhood||'') + '\',\'B\')" style="background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600">💾 Save this market</button>'
        + '<button class="chip" onclick="goToRealtorWithMarket(\'' + city + '\',\'' + province + '\')">🏡 Find a realtor in this market →</button>'
        + '</div>';
      addMsg('vera', saveHtml);
    }, 400);

  } catch(err) {
    typingBub.innerHTML = 'Sorry, I had trouble fetching neighbourhood data. Please try again.';
  }
}

function startOver() {
  selectedProvinces = [];
  step = 'pick-provinces';
  addMsg('vera', 'No problem — let\'s start fresh. Which provinces would you like to compare this time?', true);
  setTimeout(showProvincePicker, 300);
}

// Reset province picker so it works after startOver
var pickerCount = 0;

async function sendText() {
  var text = document.getElementById('inp').value.trim();
  if (!text || busy) return;
  document.getElementById('inp').value = '';
  document.getElementById('inp').style.height = 'auto';
  addMsg('user', text, true);
  busy = true;
  document.getElementById('sbtn').disabled = true;
  var typingBub = addMsg('vera', '<div class="typing"><span></span><span></span><span></span></div>');
  try {
    var resp = await fetch(PROXY + '/insights', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: (knowledge ? 'Knowledge base:\n' + knowledge + '\n\n' : '') + 'Answer this question about Canadian real estate markets in plain conversational text. Be specific and helpful: ' + text,
        category: 'Find a Market',
        mode: 'chat'
      })
    });
    var data = await resp.json();
    typingBub.innerHTML = (data.answer || data.text || 'Sorry, I could not answer that.').replace(/\n/g, '<br>');
  } catch(err) {
    typingBub.innerHTML = 'Sorry, I had trouble connecting. Please try again.';
  }
  busy = false;
  document.getElementById('sbtn').disabled = false;
}

async function loadKnowledge() {
  try {
    var resp = await fetch(PROXY + '/get-knowledge?category=' + encodeURIComponent('Find a Market'));
    if (resp.ok) {
      var data = await resp.json();
      knowledge = data.text || '';
    }
  } catch(e) {}
}

// Start
loadKnowledge();
addMsg('vera', 'Hi! I\'ll help you find the right Canadian market for multifamily investing. I\'ll compare provinces, research cities, and grade neighbourhoods — so you know exactly where to buy.', true);
setTimeout(showProvincePicker, 400);

function goToRealtorWithMarket(city, province) {
  // Flag consumed once by vera-realtor.html's onload, so it auto-selects
  // this market immediately instead of just offering it as a chip to click.
  try { localStorage.setItem('vera_auto_realtor_market', JSON.stringify({ city: city, province: province })); } catch(e) {}
  try {
    if (window.parent && window.parent.showPanel) {
      window.parent.showPanel('search', window.parent.document.getElementById('nav-search'));
    }
  } catch(e) {}
}

async function saveMarket(city, province, neighbourhood, cls) {
  try {
    var email = '';
    try { if (window.parent && window.parent.getEmail) email = window.parent.getEmail(); } catch(e) {}
    if (!email) { alert('Please log in to save your market.'); return; }
    var resp = await fetch('https://vera-proxy.onrender.com/save-market', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: email, city: city, province: province||'', neighbourhood: neighbourhood||'', cls: cls||'', condition: 'BRRRR' })
    });
    var data = await resp.json();
    if (data.success) addMsg('vera', 'Market saved — ' + (neighbourhood ? neighbourhood + ', ' : '') + city + '. Head to the Find a Realtor tab.', true);
  } catch(e) { alert('Error saving market.'); }
}
